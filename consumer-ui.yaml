apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-analytics-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browser-analytics-ui
  template:
    metadata:
      labels:
        app: browser-analytics-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-vars
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, os, socket, threading, time
              from http.server import BaseHTTPRequestHandler, HTTPServer

              counts = {"Chrome": 0, "Edge": 0, "Safari": 0, "Firefox": 0, "Other": 0}
              ns = os.getenv("NAMESPACE", "mtechnology-demo")

              def pub_nats(browser):
                try:
                  with socket.create_connection(("nats", 4222), timeout=2) as s:
                    b = browser.encode()
                    s.sendall(b'CONNECT {"verbose":false}\r\nPUB browsers.visits %d\r\n%s\r\n' % (len(b), b))
                except Exception:
                  pass

              def sub_nats():
                while True:
                  try:
                    with socket.create_connection(("nats", 4222), timeout=10) as s:
                      f = s.makefile("r", encoding="utf-8", errors="ignore")
                      s.sendall(b'CONNECT {"verbose":false}\r\nSUB browsers.visits 1\r\n')
                      for line in f:
                        if line.startswith("PING"):
                          s.sendall(b"PONG\r\n")
                        elif line.startswith("MSG "):
                          b = f.readline().strip()
                          counts[b if b in counts else "Other"] += 1
                  except Exception:
                    time.sleep(2)

              threading.Thread(target=sub_nats, daemon=True).start()

              HTML = f"""<!doctype html><html><head><meta charset="utf-8"><title>NATS Browser Stats ({ns})</title>
              <style>body{{font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;max-width:560px;margin:3rem auto;padding:0 1rem}}
              .card{{background:#1e293b;border-radius:12px;padding:1.5rem;box-shadow:0 8px 24px rgba(0,0,0,.3)}}
              .row{{margin:.85rem 0}}.lbl{{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}}
              .bar{{height:10px;background:#334155;border-radius:6px;overflow:hidden}}.fill{{height:100%;background:#8b5cf6;transition:width .3s}}
              button{{background:#334155;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;margin:4px 4px 0 0}}
              button:hover{{background:#7c3aed}}code{{color:#c4b5fd}}</style></head><body>
              <div class="card"><h2 style="margin-top:0">Statystyki Przeglądarek (NATS Live)</h2>
              <p style="color:#94a3b8;font-size:.85rem">Namespace: <code>{ns}</code> • Kolejka: <code>nats://nats:4222 (browsers.visits)</code></p>
              <div id="stats"></div><hr style="border-color:#334155;margin:1rem 0">
              <div style="font-size:.8rem;color:#94a3b8">Wyślij zdarzenie na NATS:</div>
              <div>{"".join(f'<button onclick="send(\'{k}\')">+1 {k}</button>' for k in counts)}</div></div>
              <script>
              async function load(){{const r=await fetch('/stats');const d=await r.json();const tot=Object.values(d).reduce((a,b)=>a+b,0)||1;
              document.getElementById('stats').innerHTML=Object.entries(d).map(([k,v])=>`<div class="row"><div class="lbl"><b>${{k}}</b><span>${{v}} (${{Math.round(v*100/tot)}}%)</span></div><div class="bar"><div class="fill" style="width:${{v*100/tot}}%"></div></div></div>`).join('');}}
              async function send(b){{await fetch('/track?b='+b,{{method:'POST'}});load();}}
              setInterval(load,1500);load();
              </script></body></html>"""

              class H(BaseHTTPRequestHandler):
                def do_GET(self):
                  if self.path == "/stats":
                    body = json.dumps(counts).encode()
                    self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(body)
                  else:
                    self.send_response(200); self.send_header("Content-Type", "text/html; charset=utf-8"); self.end_headers(); self.wfile.write(HTML.encode())
                def do_POST(self):
                  b = self.path.split("b=")[-1] if "b=" in self.path else "Other"
                  pub_nats(b)
                  self.send_response(204); self.end_headers()
                def log_message(self, *args): pass

              HTTPServer(("0.0.0.0", 8080), H).serve_forever()
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: browser-analytics-ui
spec:
  selector:
    app: browser-analytics-ui
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-analytics-route
  annotations:
    external-dns.alpha.kubernetes.io/hostname: demo.sysait.com
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cf-lcj11-a-public
      namespace: istio-system
  hostnames:
    - demo.sysait.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: browser-analytics-ui
          port: 80
          weight: 1
