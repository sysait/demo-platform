apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - snake-app.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: platform-vars
    envs:
      - vars.properties

replacements:
  - source:
      kind: ConfigMap
      name: platform-vars
      fieldPath: data.NAMESPACE
    targets:
      - select: { kind: .* }
        fieldPaths: [metadata.namespace]
        options: { create: true }
  - source:
      kind: ConfigMap
      name: platform-vars
      fieldPath: data.ORG_PREFIX
    targets:
      - select: { kind: .* }
        fieldPaths: ["metadata.labels.[sysait.com/org]"]
        options: { create: true }
      - select: { kind: Deployment }
        fieldPaths: ["spec.template.metadata.labels.[sysait.com/org]"]
        options: { create: true }
  - source:
      kind: ConfigMap
      name: platform-vars
      fieldPath: data.ENV_SUFFIX
    targets:
      - select: { kind: .* }
        fieldPaths: ["metadata.labels.[sysait.com/environment]"]
        options: { create: true }
      - select: { kind: Deployment }
        fieldPaths: ["spec.template.metadata.labels.[sysait.com/environment]"]
        options: { create: true }
