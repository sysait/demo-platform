apiVersion: apps/v1
kind: Deployment
metadata:
  name: snake-game
  labels:
    app: snake-game
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snake-game
  template:
    metadata:
      labels:
        app: snake-game
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: python:3.12-alpine
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: platform-vars
                  key: NAMESPACE
                  optional: true
            - name: GAME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: snake-game-secret
                  key: GAME_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              PORT = 8080
              DEFAULT_PASS = "SysAIT-Snake-2026"

              def get_password():
                return os.environ.get("GAME_PASSWORD", DEFAULT_PASS).strip()

              def get_namespace():
                return os.environ.get("NAMESPACE", "demo-platform").strip()

              HTML_PAGE = """<!DOCTYPE html>
              <html lang="pl">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>SysAIT Cyber Snake 2026</title>
                <style>
                  :root {
                    --bg: #090d16;
                    --card: #131b2e;
                    --border: #233554;
                    --neon-green: #10b981;
                    --neon-cyan: #06b6d4;
                    --neon-red: #ef4444;
                    --neon-yellow: #f59e0b;
                    --text: #e2e8f0;
                    --muted: #94a3b8;
                  }
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body {
                    background: radial-gradient(circle at center, #111827 0%, var(--bg) 100%);
                    color: var(--text);
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    padding: 1rem;
                  }
                  .container {
                    width: 100%;
                    max-width: 520px;
                    background: var(--card);
                    border: 1px solid var(--border);
                    border-radius: 16px;
                    padding: 1.5rem;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(16, 185, 129, 0.1);
                    position: relative;
                    overflow: hidden;
                  }
                  .badge-bar {
                    display: flex;
                    justify-content: space-between;
                    font-size: 0.75rem;
                    color: var(--muted);
                    margin-bottom: 1rem;
                    padding-bottom: 0.5rem;
                    border-bottom: 1px solid var(--border);
                  }
                  .badge {
                    display: inline-flex;
                    align-items: center;
                    gap: 4px;
                    background: #1e293b;
                    padding: 2px 8px;
                    border-radius: 9999px;
                    color: var(--neon-cyan);
                    font-family: monospace;
                  }
                  .badge.vault { color: var(--neon-green); }
                  h1 {
                    font-size: 1.6rem;
                    text-align: center;
                    margin-bottom: 0.25rem;
                    color: #fff;
                    letter-spacing: 1px;
                    text-shadow: 0 0 10px rgba(16,185,129,0.5);
                  }
                  .subtitle {
                    text-align: center;
                    font-size: 0.85rem;
                    color: var(--muted);
                    margin-bottom: 1.25rem;
                  }
                  /* Lock Screen */
                  #lockScreen {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                    padding: 1.5rem 0.5rem;
                  }
                  .lock-icon {
                    font-size: 3rem;
                    margin-bottom: 1rem;
                    filter: drop-shadow(0 0 8px var(--neon-yellow));
                  }
                  .lock-info {
                    font-size: 0.9rem;
                    color: var(--muted);
                    margin-bottom: 1.25rem;
                    line-height: 1.4;
                  }
                  .code-hint {
                    background: #0f172a;
                    padding: 4px 8px;
                    border-radius: 6px;
                    color: var(--neon-yellow);
                    font-family: monospace;
                    font-size: 0.85rem;
                    display: inline-block;
                    margin-top: 4px;
                    border: 1px dashed var(--border);
                  }
                  .input-group {
                    width: 100%;
                    max-width: 320px;
                    margin-bottom: 1rem;
                  }
                  input[type="password"], input[type="text"] {
                    width: 100%;
                    padding: 0.75rem 1rem;
                    border-radius: 8px;
                    background: #0b1120;
                    border: 1px solid var(--border);
                    color: #fff;
                    font-size: 1rem;
                    outline: none;
                    text-align: center;
                    transition: border-color 0.2s;
                  }
                  input:focus { border-color: var(--neon-green); box-shadow: 0 0 8px rgba(16,185,129,0.3); }
                  .btn {
                    padding: 0.75rem 1.5rem;
                    border-radius: 8px;
                    border: none;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s;
                    font-size: 0.95rem;
                  }
                  .btn-primary {
                    background: var(--neon-green);
                    color: #042f2e;
                  }
                  .btn-primary:hover {
                    background: #34d399;
                    box-shadow: 0 0 12px rgba(16,185,129,0.5);
                  }
                  .error-msg {
                    color: var(--neon-red);
                    font-size: 0.85rem;
                    margin-top: 0.5rem;
                    min-height: 1.2rem;
                  }
                  /* Game Screen */
                  #gameScreen { display: none; flex-direction: column; align-items: center; }
                  .score-board {
                    display: flex;
                    justify-content: space-around;
                    width: 100%;
                    margin-bottom: 0.75rem;
                    background: #0b1120;
                    padding: 0.5rem;
                    border-radius: 8px;
                    font-family: monospace;
                    font-size: 0.95rem;
                  }
                  .score-board span { font-weight: bold; color: var(--neon-green); }
                  canvas {
                    background: #060911;
                    border: 2px solid var(--border);
                    border-radius: 8px;
                    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
                    max-width: 100%;
                    height: auto;
                  }
                  .controls-hint {
                    margin-top: 0.75rem;
                    font-size: 0.8rem;
                    color: var(--muted);
                    text-align: center;
                  }
                  /* Mobile D-Pad */
                  .dpad {
                    display: grid;
                    grid-template-columns: repeat(3, 50px);
                    grid-template-rows: repeat(2, 45px);
                    gap: 6px;
                    margin-top: 1rem;
                    justify-content: center;
                  }
                  .dpad-btn {
                    background: #1e293b;
                    border: 1px solid var(--border);
                    color: #fff;
                    border-radius: 8px;
                    font-size: 1.2rem;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    cursor: pointer;
                    user-select: none;
                  }
                  .dpad-btn:active { background: var(--neon-green); color: #000; }
                  .dpad-up { grid-column: 2; grid-row: 1; }
                  .dpad-left { grid-column: 1; grid-row: 2; }
                  .dpad-down { grid-column: 2; grid-row: 2; }
                  .dpad-right { grid-column: 3; grid-row: 2; }
                  .btn-relock {
                    margin-top: 1rem;
                    background: transparent;
                    border: 1px solid var(--border);
                    color: var(--muted);
                    padding: 4px 10px;
                    border-radius: 6px;
                    font-size: 0.75rem;
                    cursor: pointer;
                  }
                  .btn-relock:hover { color: var(--neon-red); border-color: var(--neon-red); }
                  /* Prompt Card */
                  .card-prompt {
                    margin-top: 1.25rem;
                    background: #0b1120;
                    border: 1px solid var(--border);
                    border-radius: 12px;
                    overflow: hidden;
                    font-size: 0.85rem;
                  }
                  details summary {
                    padding: 0.75rem 1rem;
                    background: #1e293b;
                    cursor: pointer;
                    font-weight: 600;
                    color: var(--neon-cyan);
                    outline: none;
                    user-select: none;
                    transition: background 0.2s;
                  }
                  details summary:hover { background: #334155; }
                  .prompt-body { padding: 1rem; }
                  .prompt-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 0.75rem;
                    gap: 8px;
                  }
                  .btn-copy {
                    background: var(--neon-green);
                    color: #042f2e;
                    border: none;
                    padding: 4px 10px;
                    border-radius: 6px;
                    font-size: 0.75rem;
                    font-weight: 700;
                    cursor: pointer;
                    transition: opacity 0.2s;
                    white-space: nowrap;
                  }
                  .btn-copy:hover { opacity: 0.9; }
                  pre.prompt-code {
                    background: #030712;
                    border: 1px solid #1f2937;
                    border-radius: 8px;
                    padding: 0.75rem;
                    color: #cbd5e1;
                    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                    font-size: 0.75rem;
                    line-height: 1.45;
                    white-space: pre-wrap;
                    word-break: break-word;
                    max-height: 250px;
                    overflow-y: auto;
                  }
                </style>
              </head>
              <body>
                <div class="container">
                  <div class="badge-bar">
                    <span class="badge">🌐 ns: <b id="nsBadge">...</b></span>
                    <span class="badge vault">🔐 Platform Secret Vault: ACTIVE</span>
                  </div>

                  <h1>🐍 CYBER SNAKE</h1>
                  <p class="subtitle">Platform Control Plane • Declarative GitOps Demo</p>

                  <!-- Lock Screen -->
                  <div id="lockScreen">
                    <div class="lock-icon">🔒</div>
                    <p class="lock-info">
                      Dostęp do gry jest zabezpieczony hasłem wstrzykniętym ze skarbca <b>Platform Secret Vault</b> za pomocą <code>stctl secrets</code>.
                    </p>
                    <div class="code-hint">
                      Domyślne hasło demonstracyjne: <b>SysAIT-Snake-2026</b>
                    </div>
                    <form id="unlockForm" onsubmit="unlockGame(event)" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top:1.2rem;">
                      <div class="input-group">
                        <input type="password" id="passInput" placeholder="Wprowadź hasło gry..." autocomplete="current-password" autofocus required>
                      </div>
                      <button type="submit" class="btn btn-primary" id="unlockBtn">Odblokuj i Zagraj</button>
                      <div class="error-msg" id="errorMsg"></div>
                    </form>
                  </div>

                  <!-- Game Screen -->
                  <div id="gameScreen">
                    <div class="score-board">
                      <div>WYNIK: <span id="scoreVal">0</span></div>
                      <div>REKORD: <span id="highScoreVal">0</span></div>
                    </div>
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                    <div class="controls-hint">
                      Sterowanie: Strzałki / WASD na klawiaturze lub przyciski poniżej
                    </div>
                    <div class="dpad">
                      <button class="dpad-btn dpad-up" onclick="setDir(0, -1)">▲</button>
                      <button class="dpad-btn dpad-left" onclick="setDir(-1, 0)">◀</button>
                      <button class="dpad-btn dpad-down" onclick="setDir(0, 1)">▼</button>
                      <button class="dpad-btn dpad-right" onclick="setDir(1, 0)">▶</button>
                    </div>
                    <button class="btn-relock" onclick="relockGame()">🔒 Zablokuj ponownie</button>
                  </div>

                  <!-- Prompt dla Agenta AI -->
                  <div class="card-prompt">
                    <details>
                      <summary>🤖 Prompt dla Agenta AI (stctl mcp-proxy)</summary>
                      <div class="prompt-body">
                        <div class="prompt-header">
                          <span style="color:var(--muted); font-size:0.75rem;">Skopiuj i wklej do Cursor / Claude / Antigravity:</span>
                          <button class="btn-copy" id="copyBtn" onclick="copyAgentPrompt()">📋 Kopiuj Prompt</button>
                        </div>
                        <pre class="prompt-code" id="promptText">Ładowanie promptu...</pre>
                      </div>
                    </details>
                  </div>
                </div>

                <script>
                  const agentPrompt = "Działasz jako inżynier DevOps/Platform w organizacji SysAIT. Masz bezpośredni dostęp do Platform Control Plane przez uruchomiony serwer MCP (włączyłem stctl mcp-proxy) oraz narzędzie CLI stctl.\\n\\n" +
                    "Zadanie:\\n" +
                    "Wdróż od zera (Zero-to-One) aplikację demonstracyjną z repozytorium: https://github.com/sysait/demo-platform.git na platformie SysAIT.\\n\\n" +
                    "Wymagania i procedury:\\n" +
                    "1. Procedura bazowa:\\n" +
                    "   - Przed podjęciem działań przeczytaj wytyczne z zasobów MCP sysait://guides/application_bootstrap oraz sysait://guides/deployment_authoring.\\n" +
                    "   - Zweryfikuj dostępne zasoby organizacji (stctl quota get).\\n\\n" +
                    "2. Przygotowanie środowiska i zasobów:\\n" +
                    "   - Utwórz dedykowany, odizolowany namespace dla środowiska (np. stctl ns create demo --type development --cpu 1 --mem 2 --storage 10).\\n" +
                    "   - Przygotuj manifesty Kubernetes w repozytorium Git zgodnie z zasadami platformy (non-root UID 1000, brak eskalacji uprawnień, drop ALL capabilities, zdefiniowane requests i limits, liveness/readiness probes na /health).\\n\\n" +
                    "3. Zarządzanie tajemnicami (Zero-Secret Intermediation):\\n" +
                    "   - Wszelkie wrażliwe dane (np. hasło dostępu do aplikacji) wstrzyknij do Platform Secret Vault za pomocą stctl secrets put.\\n" +
                    "   - Zwiąż klucz ze środowiskiem za pomocą stctl secrets bind do wskazanego sekretu Kubernetes (snake-game-secret).\\n" +
                    "   - Pamiętaj o adnotacji reloader.stakater.com/auto: \\\"true\\\" w Deployment, aby umożliwić bezprzerwową rotację hasła.\\n\\n" +
                    "4. Wdrożenie GitOps i ekspozycja:\\n" +
                    "   - Zarejestruj i zsynchronizuj aplikację w kontrolerze GitOps (stctl apps create oraz stctl apps sync).\\n" +
                    "   - Wystaw aplikację na świat za pomocą stctl domains expose z ograniczeniem IP do adresu wywołującego (curl -4 ifconfig.me).\\n\\n" +
                    "Po zakończeniu wdrożenia przetestuj endpoint za pomocą curl, podaj publiczny URL aplikacji, hasło odblokowujące oraz przygotuj czytelny plik README.md opisujący procedurę.";

                  document.getElementById("promptText").textContent = agentPrompt;

                  function copyAgentPrompt() {
                    navigator.clipboard.writeText(agentPrompt).then(() => {
                      const btn = document.getElementById("copyBtn");
                      btn.textContent = "Skopiowano! ✅";
                      setTimeout(() => { btn.textContent = "📋 Kopiuj Prompt"; }, 2000);
                    }).catch(() => {
                      alert("Błąd kopiowania do schowka.");
                    });
                  }

                  let namespace = "demo";
                  let gameRunning = false;
                  let score = 0;
                  let highScore = localStorage.getItem("snake_high_score") || 0;
                  document.getElementById("highScoreVal").textContent = highScore;

                  fetch('/api/status')
                    .then(r => r.json())
                    .then(data => {
                      namespace = data.namespace || "demo";
                      document.getElementById("nsBadge").textContent = namespace;
                    })
                    .catch(() => { document.getElementById("nsBadge").textContent = "offline"; });

                  async function unlockGame(e) {
                    e.preventDefault();
                    const pass = document.getElementById("passInput").value.trim();
                    const err = document.getElementById("errorMsg");
                    const btn = document.getElementById("unlockBtn");
                    err.textContent = "";
                    btn.disabled = true;

                    try {
                      const res = await fetch('/api/unlock', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pass })
                      });
                      const json = await res.json();
                      if (res.ok && json.success) {
                        document.getElementById("lockScreen").style.display = "none";
                        document.getElementById("gameScreen").style.display = "flex";
                        startGame();
                      } else {
                        err.textContent = json.message || "Błędne hasło! Sprawdź stctl secrets.";
                      }
                    } catch (ex) {
                      err.textContent = "Błąd połączenia z serwerem gry.";
                    } finally {
                      btn.disabled = false;
                    }
                  }

                  function relockGame() {
                    gameRunning = false;
                    document.getElementById("passInput").value = "";
                    document.getElementById("errorMsg").textContent = "";
                    document.getElementById("gameScreen").style.display = "none";
                    document.getElementById("lockScreen").style.display = "flex";
                  }

                  // SNAKE LOGIC
                  const canvas = document.getElementById("gameCanvas");
                  const ctx = canvas.getContext("2d");
                  const GRID = 20;
                  const TILE_COUNT = canvas.width / GRID;

                  let snake = [{x: 10, y: 10}];
                  let velocity = {x: 1, y: 0};
                  let nextVelocity = {x: 1, y: 0};
                  let food = {x: 15, y: 15};
                  let gameLoopTimer = null;

                  function startGame() {
                    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
                    velocity = {x: 1, y: 0};
                    nextVelocity = {x: 1, y: 0};
                    score = 0;
                    document.getElementById("scoreVal").textContent = score;
                    placeFood();
                    gameRunning = true;
                    if (gameLoopTimer) clearInterval(gameLoopTimer);
                    gameLoopTimer = setInterval(gameLoop, 110);
                  }

                  function placeFood() {
                    food = {
                      x: Math.floor(Math.random() * TILE_COUNT),
                      y: Math.floor(Math.random() * TILE_COUNT)
                    };
                    for (let s of snake) {
                      if (s.x === food.x && s.y === food.y) return placeFood();
                    }
                  }

                  function setDir(x, y) {
                    if (!gameRunning) { startGame(); return; }
                    if (x !== 0 && velocity.x === 0) nextVelocity = {x, y: 0};
                    if (y !== 0 && velocity.y === 0) nextVelocity = {x: 0, y};
                  }

                  window.addEventListener("keydown", e => {
                    if (!gameRunning) return;
                    if (["ArrowUp", "KeyW"].includes(e.code)) { setDir(0, -1); e.preventDefault(); }
                    if (["ArrowDown", "KeyS"].includes(e.code)) { setDir(0, 1); e.preventDefault(); }
                    if (["ArrowLeft", "KeyA"].includes(e.code)) { setDir(-1, 0); e.preventDefault(); }
                    if (["ArrowRight", "KeyD"].includes(e.code)) { setDir(1, 0); e.preventDefault(); }
                  });

                  function gameLoop() {
                    if (!gameRunning) return;
                    velocity = nextVelocity;
                    const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

                    // Wall wrap-around
                    if (head.x < 0) head.x = TILE_COUNT - 1;
                    if (head.x >= TILE_COUNT) head.x = 0;
                    if (head.y < 0) head.y = TILE_COUNT - 1;
                    if (head.y >= TILE_COUNT) head.y = 0;

                    // Self collision
                    for (let part of snake) {
                      if (part.x === head.x && part.y === head.y) {
                        gameOver();
                        return;
                      }
                    }

                    snake.unshift(head);

                    // Check Food
                    if (head.x === food.x && head.y === food.y) {
                      score += 10;
                      document.getElementById("scoreVal").textContent = score;
                      if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("snake_high_score", highScore);
                        document.getElementById("highScoreVal").textContent = highScore;
                      }
                      placeFood();
                    } else {
                      snake.pop();
                    }

                    render();
                  }

                  function gameOver() {
                    gameRunning = false;
                    clearInterval(gameLoopTimer);
                    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "#ef4444";
                    ctx.font = "bold 26px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("KONIEC GRY!", canvas.width / 2, canvas.height / 2 - 15);
                    ctx.fillStyle = "#e2e8f0";
                    ctx.font = "16px sans-serif";
                    ctx.fillText("Twój wynik: " + score, canvas.width / 2, canvas.height / 2 + 15);
                    ctx.fillStyle = "#10b981";
                    ctx.fillText("Naciśnij sterowanie aby zagrać ponownie", canvas.width / 2, canvas.height / 2 + 45);
                  }

                  function render() {
                    ctx.fillStyle = "#060911";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Draw grid lines
                    ctx.strokeStyle = "#111827";
                    ctx.lineWidth = 1;
                    for (let i = 0; i < canvas.width; i += GRID) {
                      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
                    }

                    // Draw Food
                    ctx.fillStyle = "#ef4444";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ef4444";
                    ctx.beginPath();
                    ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Draw Snake
                    snake.forEach((part, index) => {
                      if (index === 0) {
                        ctx.fillStyle = "#10b981";
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "#10b981";
                      } else {
                        ctx.fillStyle = "#059669";
                        ctx.shadowBlur = 0;
                      }
                      ctx.fillRect(part.x * GRID + 1, part.y * GRID + 1, GRID - 2, GRID - 2);
                    });
                    ctx.shadowBlur = 0;
                  }
                </script>
              </body>
              </html>
              """

              class RequestHandler(BaseHTTPRequestHandler):
                def do_GET(self):
                  if self.path == "/health":
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(b'{"status":"healthy","service":"snake-game"}')
                  elif self.path == "/api/status":
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    res = json.dumps({"status": "ok", "namespace": get_namespace()}).encode()
                    self.wfile.write(res)
                  else:
                    self.send_response(200)
                    self.send_header("Content-Type", "text/html; charset=utf-8")
                    self.end_headers()
                    self.wfile.write(HTML_PAGE.encode("utf-8"))

                def do_POST(self):
                  if self.path == "/api/unlock":
                    content_length = int(self.headers.get('Content-Length', 0))
                    post_data = self.rfile.read(content_length)
                    try:
                      payload = json.loads(post_data.decode('utf-8'))
                      provided_pass = payload.get("password", "").strip()
                      expected_pass = get_password()
                      if provided_pass == expected_pass:
                        self.send_response(200)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write(json.dumps({"success": True, "message": "Gra odblokowana!", "namespace": get_namespace()}).encode())
                      else:
                        self.send_response(401)
                        self.send_header("Content-Type", "application/json")
                        self.end_headers()
                        self.wfile.write(json.dumps({"success": False, "message": "Niepoprawne haslo. Sprawdz sekret w stctl."}).encode())
                    except Exception as e:
                      self.send_response(400)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"success": False, "message": "Blad zadania"}).encode())
                  else:
                    self.send_response(404)
                    self.end_headers()

                def log_message(self, format, *args):
                  pass

              print(f"Cyber Snake Server starting on port {PORT}...")
              HTTPServer(("0.0.0.0", PORT), RequestHandler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: snake-game
  labels:
    app: snake-game
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: snake-game
